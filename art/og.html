<!doctype html>
<!-- CreatorPay share card (1200 x 630). Render: msedge --headless --screenshot=og.png --window-size=1200,630 art/og.html, then save as assets/og.jpg -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #07080a; }
  .bg { position: absolute; inset: 0; background: radial-gradient(circle at 74% 50%, #1d2608 0, #0b0d07 36%, #07080a 70%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(212,255,58,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(212,255,58,.06) 1px, transparent 1px); background-size: 42px 42px;
          -webkit-mask-image: radial-gradient(circle at 74% 50%, transparent 0 190px, #000 340px, transparent 640px); }
  .coin { position: absolute; right: 70px; top: 50%; width: 470px; transform: translateY(-50%); filter: drop-shadow(0 30px 50px rgba(0,0,0,.6)); }
  .txt { position: absolute; left: 76px; top: 150px; }
  .word { font: 700 92px/1 Geist; letter-spacing: -.045em; color: #f2f4ef; }
  .line { margin-top: 22px; font: 500 38px/1.15 Geist; letter-spacing: -.02em; color: #d4ff3a; }
  .sub { margin-top: 18px; font: 400 21px/1.45 Geist; color: #9aa190; max-width: 520px; }
  .tkr { margin-top: 34px; display: inline-block; padding: 9px 16px; border: 1px solid rgba(212,255,58,.35); border-radius: 999px; font: 700 20px 'Geist Mono'; letter-spacing: .1em; color: #d4ff3a; }
  .fine { position: absolute; left: 76px; bottom: 26px; font: 400 13px Geist; color: #4d5346; }
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<img class="coin" src="../art/out/coin_raw.png" alt="">
<div class="txt">
  <div class="word">CreatorPay</div>
  <div class="line">Get paid per view.</div>
  <div class="sub">Creators fund campaigns. Clippers post on X and get paid in SOL for every 1,000 views.</div>
  <div class="tkr">$CREATORPAY</div>
</div>
<div class="fine">Independent. Not affiliated with pump.fun.</div>
</body></html>
